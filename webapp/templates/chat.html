<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Чат</title>
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/static/chat.css">
</head>
<body>
  <div class="topbar">
    <div>
      <div class="chat-title" id="chatTitle">Обращение</div>
      <div class="chat-meta" id="chatMeta">Загрузка…</div>
    </div>
  </div>

  <div id="messages" class="messages"></div>

  <div class="footer">
    <div class="composer">
      <input id="file" type="file" class="file-input" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.txt,.xlsx,.xls,.csv,.zip,.rar,.7z,.pptx,.ppt,.rtf" />
      <button id="attach" title="Прикрепить файл">📎</button>

      <!-- Кнопка оплаты для специалиста -->
      <button id="payBtn" class="pay-btn" style="display:none;" title="Сформировать оплату">💳</button>
      <button id="callBtn" class="call-btn" style="display:none;" title="Начать звонок">📞 Позвонить</button>

      <textarea id="text" placeholder="Сообщение..." rows="1"></textarea>
      <button id="send">Отправить</button>
    </div>

    <div id="inputHint" class="hint" style="display:none;"></div>
    <div id="fileHint" class="file-hint" style="display:none;"></div>
  </div>

  <script>
    window.CHAT_ID = {{ chat_id }};
    window.MY_SENDER = {{ sender }};
    window.CHAT_TOKEN = "{{ token }}";
    window.IS_MOBILE = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
  </script>

  <script src="/static/chat.js"></script>
</body>
</html>

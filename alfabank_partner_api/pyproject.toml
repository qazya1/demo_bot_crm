[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alfabank-partner-api"
version = "0.1.0"
description = "Python SDK for Alfa-Bank partner API (https://partner.alfabank.ru/public-api/v2)"
readme = "README.md"
requires-python = "==3.10.*"
license = { text = "Proprietary" }
authors = [{ name = "CRM Integration Team" }]
dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.6,<3.0",
    "pydantic[email]>=2.6,<3.0",
    "tenacity>=8.2,<10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
alfabank_partner_api = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["N818"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: integration tests against the demo environment (requires ALFABANK_RUN_INTEGRATION=1)",
]
testpaths = ["tests"]

{# Единые стили для боковой навигации CRM. Подключать в <head> шаблонов #}

<style>
/* ==================== SIDEBAR ==================== */
.sidebar {
    position: fixed;
    left: 0;
    top: 0;
    width: 260px;
    height: 100vh;
    background: linear-gradient(180deg, #1a1f36 0%, #252d4a 100%);
    padding: 0;
    z-index: 1000;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

@supports (padding: max(0px)) {
    .sidebar {
        padding-top: max(env(safe-area-inset-top), 0);
    }
}

/* Логотип */
.sidebar-logo {
    padding: 1.5rem;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    flex-shrink: 0;
}

.sidebar-logo h2 {
    color: white;
    font-size: 1.4rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: 0.5px;
}

.sidebar-user-info {
    color: rgba(255, 255, 255, 0.5);
    font-size: 0.75rem;
    margin-top: 0.35rem;
    font-weight: 400;
}

/* Навигация */
.sidebar-nav {
    padding: 1rem 0 1.5rem 0;
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.25) rgba(0, 0, 0, 0.12);
}

.sidebar-nav::-webkit-scrollbar {
    width: 8px;
}

.sidebar-nav::-webkit-scrollbar-track {
    background: rgba(0, 0, 0, 0.12);
    border-radius: 8px;
}

.sidebar-nav::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.22);
    border-radius: 8px;
    border: 2px solid transparent;
    background-clip: padding-box;
}

.sidebar-nav::-webkit-scrollbar-thumb:hover {
    background: rgba(255, 255, 255, 0.34);
    background-clip: padding-box;
}

/* Ссылки меню */
.sidebar-nav a {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.85rem 1.5rem;
    color: rgba(255, 255, 255, 0.75);
    text-decoration: none;
    transition: all 0.2s ease;
    border-left: 3px solid transparent;
    font-size: 0.95rem;
    position: relative;
}

.sidebar-nav a:hover {
    background: rgba(255, 255, 255, 0.08);
    color: white;
}

.sidebar-nav a.active {
    background: rgba(102, 126, 234, 0.18);
    color: #667eea;
    border-left-color: #667eea;
    font-weight: 500;
}

.sidebar-nav a .icon {
    font-size: 1.2rem;
    width: 24px;
    text-align: center;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}

/* Подпункты меню */
.sidebar-nav a.sub-item {
    padding-left: 2.8rem;
    font-size: 0.9rem;
}

/* Разделители секций */
.sidebar-section {
    padding: 0.75rem 1.5rem 0.5rem 1.5rem;
    color: rgba(255, 255, 255, 0.35);
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    font-weight: 600;
    margin-top: 0.75rem;
}

.sidebar-section:first-child {
    margin-top: 0;
}


.sidebar-nav a.partner-item {
    margin: 0.15rem 0.65rem;
    border-radius: 10px;
    border-left-width: 0;
    padding-left: 1rem;
}

.sidebar-nav a.partner-item.active {
    color: #ffffff;
    background: linear-gradient(135deg, rgba(102, 126, 234, 0.95), rgba(118, 75, 162, 0.92));
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.22);
}

.sidebar-nav a.partner-logout {
    margin: 0.4rem 0.65rem 0;
    border-radius: 10px;
    border: 1px solid rgba(231, 76, 60, 0.24);
}

.sidebar-user-info {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 0.35rem 0.55rem;
    border-radius: 8px;
    display: inline-block;
}

/* Бейдж уведомлений */
.notif-count {
    background: #e74c3c;
    color: white;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    margin-left: auto;
    min-width: 18px;
    text-align: center;
}

/* Внешние ссылки */
.sidebar-nav a.external-link {
    opacity: 0.85;
}

.sidebar-nav a.external-link:hover {
    opacity: 1;
}

/* Ссылка выхода */
.sidebar-nav a.logout-link {
    color: rgba(255, 255, 255, 0.6);
    margin-top: 0.5rem;
}

.sidebar-nav a.logout-link:hover {
    color: #e74c3c;
    background: rgba(231, 76, 60, 0.1);
}

/* Overlay для мобильной версии */
.sidebar-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 999;
    opacity: 0;
    transition: opacity 0.3s ease;
}

.sidebar-overlay.active {
    display: block;
    opacity: 1;
}

/* Бургер меню */
.burger-menu {
    display: none;
    background: none;
    border: none;
    color: #2c3e50;
    font-size: 1.5rem;
    cursor: pointer;
    padding: 0.5rem;
    line-height: 1;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
    justify-content: center;
}

/* ==================== МОБИЛЬНАЯ ВЕРСИЯ ==================== */
@media (max-width: 768px) {
    .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s ease;
    }
    
    .sidebar.open {
        transform: translateX(0);
    }
    
    .main-content {
        margin-left: 0;
    }
    
    .burger-menu {
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .sidebar-nav a {
        min-height: 48px;
    }
    
    .sidebar {
        width: 280px;
    }
}

/* Тач-оптимизация */
@media (max-width: 768px) {
    * {
        -webkit-tap-highlight-color: rgba(102, 126, 234, 0.15);
        touch-action: manipulation;
    }
}

/* Тёмная тема (системная) */
@media (prefers-color-scheme: dark) {
    .main-content {
        background: #1a202c;
    }
    
    .burger-menu {
        color: white;
    }
}

/* Важно: скроллбар стилизуется на .sidebar-nav, чтобы не было
   белой «полосы/угла» на стыке sidebar и контента. */
</style>
